<svg width="1200" height="390" viewBox="0 0 1200 390" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="frame" x1="70" y1="20" x2="1110" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity=".72"/>
      <stop offset=".48" stop-color="#334155" stop-opacity=".18"/>
      <stop offset="1" stop-color="#10B981" stop-opacity=".62"/>
    </linearGradient>
    <radialGradient id="violet" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(350 35) rotate(90) scale(310 430)">
      <stop stop-color="#7C3AED" stop-opacity=".34"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emerald" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1050 355) rotate(-135) scale(330 390)">
      <stop stop-color="#059669" stop-opacity=".3"/>
      <stop offset="1" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="85" y1="150" x2="760" y2="245" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".62" stop-color="#D8D8E8"/>
      <stop offset="1" stop-color="#9CA3AF"/>
    </linearGradient>
    <linearGradient id="orbit" x1="851" y1="89" x2="1104" y2="312" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#FFFFFF" stroke-opacity=".035"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .035"/>
      </feComponentTransfer>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1200" height="390" rx="32" fill="#05070A"/>
  <rect width="1200" height="390" rx="32" fill="url(#violet)"/>
  <rect width="1200" height="390" rx="32" fill="url(#emerald)"/>
  <rect x=".75" y=".75" width="1198.5" height="388.5" rx="31.25" stroke="url(#frame)" stroke-width="1.5"/>
  <rect x="25" y="25" width="1150" height="340" rx="22" fill="url(#grid)" stroke="#FFFFFF" stroke-opacity=".06"/>
  <rect x="1" y="1" width="1198" height="388" rx="31" filter="url(#grain)" opacity=".48"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="82" y="70" width="184" height="28" rx="14" fill="#FFFFFF" fill-opacity=".055" stroke="#FFFFFF" stroke-opacity=".1"/>
    <circle cx="99" cy="84" r="3.5" fill="#34D399"/>
    <text x="112" y="88" fill="#C4C7CE" font-size="11" font-weight="650" letter-spacing="2.2">CHEN ZI / 2026</text>

    <text x="80" y="178" fill="url(#title)" font-size="63" font-weight="780" letter-spacing="-2.7">AGENTIC SYSTEMS</text>
    <text x="82" y="232" fill="#F8FAFC" font-size="28" font-weight="520" letter-spacing="6.5">BUILT FOR THE REAL WORLD</text>

    <line x1="82" y1="272" x2="733" y2="272" stroke="#FFFFFF" stroke-opacity=".11"/>
    <text x="82" y="307" fill="#A7ABB4" font-size="13" font-weight="560" letter-spacing="2.25">AI AGENTS  ·  VOICE INTELLIGENCE  ·  PRODUCT ENGINEERING</text>
    <text x="82" y="334" fill="#6B7280" font-size="12" letter-spacing=".7">Observe deeply. Reason within constraints. Execute with care.</text>
  </g>

  <g>
    <circle cx="974" cy="195" r="126" stroke="#FFFFFF" stroke-opacity=".055"/>
    <circle cx="974" cy="195" r="91" stroke="url(#orbit)" stroke-opacity=".44" stroke-dasharray="3 9"/>
    <ellipse cx="974" cy="195" rx="136" ry="55" transform="rotate(-23 974 195)" stroke="url(#orbit)" stroke-opacity=".5"/>
    <ellipse cx="974" cy="195" rx="136" ry="55" transform="rotate(63 974 195)" stroke="url(#orbit)" stroke-opacity=".24"/>

    <circle cx="974" cy="195" r="53" fill="#0B0E13" stroke="#FFFFFF" stroke-opacity=".13"/>
    <circle cx="974" cy="195" r="44" fill="#FFFFFF" fill-opacity=".035" stroke="url(#orbit)" stroke-opacity=".5"/>
    <text x="974" y="205" text-anchor="middle" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="750" letter-spacing="1.5">CZ</text>

    <circle cx="866" cy="153" r="10" fill="#8B5CF6" filter="url(#glow)" opacity=".6"/>
    <circle cx="866" cy="153" r="4.5" fill="#C4B5FD"/>
    <circle cx="1086" cy="159" r="9" fill="#10B981" filter="url(#glow)" opacity=".65"/>
    <circle cx="1086" cy="159" r="4.5" fill="#6EE7B7"/>
    <circle cx="1020" cy="305" r="9" fill="#14B8A6" filter="url(#glow)" opacity=".58"/>
    <circle cx="1020" cy="305" r="4" fill="#5EEAD4"/>
    <circle cx="938" cy="82" r="4" fill="#E9D5FF"/>

    <path d="M866 153L930 184M1019 180L1086 159M989 241L1020 305M958 146L938 82" stroke="#FFFFFF" stroke-opacity=".1"/>
  </g>
</svg>
