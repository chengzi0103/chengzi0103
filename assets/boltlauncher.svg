      <stop stop-color="#120B08"/>
      <stop offset="1" stop-color="#1B0E06"/>
    </linearGradient>
    <linearGradient id="accent" x1="58" y1="20" x2="1135" y2="233" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FB923C"/>
      <stop offset="1" stop-color="#FACC15"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1030 120) rotate(180) scale(270 185)">
      <stop stop-color="#F97316" stop-opacity=".22"/>
