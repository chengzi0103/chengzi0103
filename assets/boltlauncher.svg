    <text x="58" y="67" fill="#FB923C" font-size="11" font-weight="700" letter-spacing="2.6">NATIVE APP / 03</text>
    <text x="58" y="122" fill="#F8FAFC" font-size="40" font-weight="750" letter-spacing="-.8">BoltLauncher</text>
    <text x="58" y="156" fill="#C7C1BC" font-size="15">A tiny macOS menu bar launcher that binds any app to a global</text>
    <text x="58" y="180" fill="#C7C1BC" font-size="15">hotkey, toggles it instantly, and keeps everything local.</text>

    <rect x="58" y="199" width="72" height="24" rx="12" fill="#FB923C" fill-opacity=".1" stroke="#FB923C" stroke-opacity=".26"/>
    <text x="94" y="215" text-anchor="middle" fill="#FDBA74" font-size="10" font-weight="650" letter-spacing="1">MACOS</text>
    <rect x="138" y="199" width="64" height="24" rx="12" fill="#FACC15" fill-opacity=".08" stroke="#FACC15" stroke-opacity=".22"/>
    <text x="170" y="215" text-anchor="middle" fill="#FDE68A" font-size="10" font-weight="650" letter-spacing="1">SWIFT</text>
    <rect x="210" y="199" width="76" height="24" rx="12" fill="#FFFFFF" fill-opacity=".04" stroke="#FFFFFF" stroke-opacity=".1"/>
    <text x="248" y="215" text-anchor="middle" fill="#D1D5DB" font-size="10" font-weight="650" letter-spacing="1">SQLITE</text>
  </g>

  <g transform="translate(847 45)">
    <rect x="0" y="0" width="184" height="156" rx="35" fill="#FFFFFF" fill-opacity=".035" stroke="#FFFFFF" stroke-opacity=".1"/>
