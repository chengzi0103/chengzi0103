    <path d="M98 32L58 85H88L78 126L125 68H94L98 32Z" fill="url(#accent)"/>
    <circle cx="40" cy="42" r="4" fill="#FB923C"/>
    <circle cx="52" cy="42" r="4" fill="#FACC15" fill-opacity=".7"/>
    <circle cx="64" cy="42" r="4" fill="#FFFFFF" fill-opacity=".25"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
