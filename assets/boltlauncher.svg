  <rect x=".75" y=".75" width="1198.5" height="248.5" rx="27.25" fill="url(#bg)" stroke="url(#accent)" stroke-opacity=".48" stroke-width="1.5"/>
  <rect x="20" y="20" width="1160" height="210" rx="19" fill="url(#glow)" stroke="#FFFFFF" stroke-opacity=".055"/>

